syntax = "proto3";

package benchmark;

import "google/protobuf/empty.proto";
import "google/protobuf/wrappers.proto";

// The Go implementation registers this service directly because it only uses
// protobuf well-known types and does not require generated message code.
service BenchmarkService {
  rpc Unary(google.protobuf.Empty) returns (google.protobuf.BytesValue);
  rpc Streaming(stream google.protobuf.Empty)
      returns (stream google.protobuf.BytesValue);
}
